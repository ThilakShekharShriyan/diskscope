[package]
name = "diskscope"
version = "0.1.0"
edition = "2021"
description = "A safe, reproducible Rust+Archil serverless and filesystem benchmark lab"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ThilakShekharShriyan/diskscope"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
debug = true

[profile.bench]
debug = true
