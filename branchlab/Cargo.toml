[package]
name = "branchlab"
version = "0.2.0"
edition = "2021"
description = "Safe cross-VM state and SQLite correctness probes for Archil / DiskScope"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true
