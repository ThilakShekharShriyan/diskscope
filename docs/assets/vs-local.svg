line x1="8" x2="952" y1="102" y2="102" class="ds-sep"/><text x="8" y="132" class="ds-label">small-files</text><text x="8" y="146" class="ds-sub">Create 64 × 16 B files</text><text x="308" y="125" class="ds-muted" text-anchor="end">exec, default</text><line x1="552.8" x2="608.1" y1="121" y2="121" class="st-s1 ds-whisker"/><circle cx="573.3" cy="121" r="5.5" class="f-s1 ds-ring"/><rect x="318" y="110" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="125" class="ds-value">1.7×</text><text x="308" y="151" class="ds-muted" text-anchor="end">sandbox worker</text><line x1="425.1" x2="445.5" y1="147" y2="147" class="st-s3 ds-whisker"/><circle cx="431.5" cy="147" r="5.5" class="f-s3 ds-ring"/><rect x="318" y="136" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="151" class="ds-value">0.52×</text><line x1="8" x2="952" y1="166" y2="166" class="ds-sep"/><text x="8" y="196" class="ds-label">fsync-4k</text><text x="8" y="210" class="ds-sub">Write 4 KiB + fsync</text><text x="308" y="189" class="ds-muted" text-anchor="end">exec, default</text><line x1="518.6" x2="562.0" y1="185" y2="185" class="st-s1 ds-whisker"/><circle cx="550.1" cy="185" r="5.5" class="f-s1 ds-ring"/><rect x="318" y="174" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="189" class="ds-value">1.4×</text><text x="308" y="215" class="ds-muted" text-anchor="end">sandbox worker</text><line x1="529.4" x2="572.6" y1="211" y2="211" class="st-s3 ds-whisker"/><circle cx="558.5" cy="211" r="5.5" class="f-s3 ds-ring"/><rect x="318" y="200" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="215" class="ds-value">1.5×</text><line x1="8" x2="952" y1="230" y2="230" class="ds-sep"/><text x="8" y="260" class="ds-label">seq-write</text><text x="8" y="274" class="ds-sub">Sequential write + fsync</text><text x="308" y="253" class="ds-muted" text-anchor="end">exec, default</text><line x1="701.8" x2="742.6" y1="249" y2="249" class="st-s1 ds-whisker"/><circle cx="714.4" cy="249" r="5.5" class="f-s1 ds-ring"/><rect x="318" y="238" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="253" class="ds-value">5.7×</text><text x="308" y="279" class="ds-muted" text-anchor="end">sandbox worker</text><line x1="623.6" x2="662.6" y1="275" y2="275" class="st-s3 ds-whisker"/><circle cx="636.3" cy="275" r="5.5" class="f-s3 ds-ring"/><rect x="318" y="264" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="279" class="ds-value">2.9×</text><line x1="8" x2="952" y1="294" y2="294" class="ds-sep"/><text x="8" y="324" class="ds-label">seq-read</text><text x="8" y="338" class="ds-sub">Re-read a just-written file (warm)</text><text x="308" y="317" class="ds-muted" text-anchor="end">exec, default</text><line x1="666.7" x2="720.9" y1="313" y2="313" class="st-s1 ds-whisker"/><circle cx="699.4" cy="313" r="5.5" class="f-s1 ds-ring"/><rect x="318" y="302" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="317" class="ds-value">5.0×</text><text x="308" y="343" class="ds-muted" text-anchor="end">sandbox worker</text><line x1="645.2" x2="670.2" y1="339" y2="339" class="st-s3 ds-whisker"/><circle cx="664.8" cy="339" r="5.5" class="f-s3 ds-ring"/><rect x="318" y="328" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="343" class="ds-value">3.7×</text><line x1="8" x2="952" y1="358" y2="358" class="ds-sep"/><text x="8" y="388" class="ds-label">sqlite-commit</text><text x="8" y="402" class="ds-sub">25 synchronous=FULL commits</text><text x="308" y="381" class="ds-muted" text-anchor="end">exec, default</text><line x1="784.1" x2="806.4" y1="377" y2="377" class="st-s1 ds-whisker"/><circle cx="797.9" cy="377" r="5.5" class="f-s1 ds-ring"/><rect x="318" y="366" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="381" class="ds-value">11×</text><text x="308" y="407" class="ds-muted" text-anchor="end">sandbox worker</text><line x1="775.7" x2="794.4" y1="403" y2="403" class="st-s3 ds-whisker"/><circle cx="789.5" cy="403" r="5.5" class="f-s3 ds-ring"/><rect x="318" y="392" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="407" class="ds-value">11×</text><line x1="8" x2="952" y1="422" y2="422" class="ds-sep"/><text x="8" y="452" class="ds-label">hash-64m</text><text x="8" y="466" class="ds-sub">SHA-256 of 64 MiB (CPU only)</text><text x="308" y="445" class="ds-muted" text-anchor="end">exec, default</text><line x1="471.6" x2="473.6" y1="441" y2="441" class="st-s1 ds-whisker"/><circle cx="472.2" cy="441" r="5.5" class="f-s1 ds-ring"/><rect x="318" y="430" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="445" class="ds-value">0.73×</text><text x="308" y="471" class="ds-muted" text-anchor="end">sandbox worker</text><line x1="471.2" x2="474.9" y1="467" y2="467" class="st-s3 ds-whisker"/><circle cx="471.5" cy="467" r="5.5" class="f-s3 ds-ring"/><rect x="318" y="456" width="546" height="22" class="ds-hit ds-lanehit"/><text x="876" y="471" class="ds-value">0.73×</text></svg>
