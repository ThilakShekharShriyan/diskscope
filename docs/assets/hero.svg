<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="196" viewBox="0 0 1016 196" role="img" aria-label="DiskScope headline results">
<style>/* DiskScope chart tokens + mark classes — shared by the dashboard and the standalone README SVGs.
   Palette: warm white / beige surfaces, black and grey ink. Series are separated by lightness
   (near-black, mid grey, light grey) and always carry direct labels or a legend, so identity never
   depends on hue — which also makes every chart colour-blind-safe by construction. */
:root {
  color-scheme: light;
  --plane: #f6f3ec;      /* page: warm beige */
  --surface: #fffdf8;    /* cards: warm white */
  --ink: #161513;        /* primary text */
  --ink-2: #4b4842;      /* secondary text */
  --muted: #8b867c;      /* axis, captions */
  --grid: #ebe6dc;       /* hairline grid */
  --axis: #d2cabd;       /* reference lines */
  --border: rgba(22, 21, 19, 0.09);
  --wash: #f1ede4;       /* subtle fills */
  /* series: lightness steps of one warm neutral */
  --s1: #161513; --s2: #a0988b; --s3: #5e5951; --s4: #c9c1b4;
  --s5: #161513; --s6: #a0988b; --s7: #5e5951; --s8: #c9c1b4;
  /* anatomy phases: an ordinal ramp, darkest = the platform's own cost */
  --ph-q: #161513; --ph-s: #6b665e; --ph-w: #a79f92; --ph-o: #dcd5c9;
  --good: #3f6b3a; --critical: #9c3a2e;
}
.ds-chart { display: block; overflow: visible; font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.ds-chart text { font-family: inherit; }
.ds-grid { stroke: var(--grid); stroke-width: 1; }
.ds-sep { stroke: var(--grid); stroke-width: 1; }
.ds-ref { stroke: var(--axis); stroke-width: 1.25; }
.ds-refv { stroke: var(--ink-2); stroke-width: 1.25; }
.ds-axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.ds-strong { fill: var(--ink-2); font-weight: 600; }
.ds-label { fill: var(--ink); font-size: 13px; font-weight: 600; letter-spacing: -.005em; }
.ds-sub { fill: var(--muted); font-size: 11px; }
.ds-muted { fill: var(--muted); font-size: 11.5px; }
.ds-legend { fill: var(--ink-2); font-size: 12px; }
.ds-value { fill: var(--ink); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ds-median { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.ds-median-halo { stroke: var(--surface); stroke-width: 6; stroke-linecap: round; }
.ds-ring { stroke: var(--surface); stroke-width: 2; }
.ds-dot { opacity: .92; }
.ds-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ds-whisker { stroke-width: 2.5; stroke-linecap: round; }
.ds-hit { fill: transparent; }
.ds-warm, .ds-warm-key { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
.ds-ref-key { fill: var(--axis); }
.f-s1 { fill: var(--s1); } .f-s2 { fill: var(--s2); } .f-s3 { fill: var(--s3); } .f-s4 { fill: var(--s4); }
.f-s5 { fill: var(--s5); } .f-s6 { fill: var(--s6); } .f-s7 { fill: var(--s7); } .f-s8 { fill: var(--s8); }
.st-s1 { stroke: var(--s1); } .st-s2 { stroke: var(--s2); } .st-s3 { stroke: var(--s3); } .st-s4 { stroke: var(--s4); }
.st-s5 { stroke: var(--s5); } .st-s6 { stroke: var(--s6); } .st-s7 { stroke: var(--s7); } .st-s8 { stroke: var(--s8); }
.ci-s1, .ci-s2, .ci-s3, .ci-s4, .ci-s5, .ci-s6, .ci-s7, .ci-s8 { fill: var(--ink); opacity: .07; }
.f-phase-q { fill: var(--ph-q); } .f-phase-s { fill: var(--ph-s); } .f-phase-w { fill: var(--ph-w); } .f-phase-o { fill: var(--ph-o); }
 .k{fill:var(--muted);font-size:12.5px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif} .v{fill:var(--ink);font-size:38px;font-weight:600;letter-spacing:-1px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif} .d{fill:var(--ink-2);font-size:12.5px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif} .t{fill:var(--ink);font-size:17px;font-weight:650;letter-spacing:-.2px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif} .e{fill:var(--muted);font-size:11px;font-weight:600;letter-spacing:1.6px;font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}</style>
<rect x="0.5" y="0.5" width="1015" height="195" rx="10" fill="var(--surface)" stroke="var(--grid)"/>
<circle cx="40" cy="39" r="7.5" fill="none" stroke="var(--ink)" stroke-width="1.4"/><circle cx="40" cy="39" r="2.2" fill="var(--ink)"/>
<text x="56" y="45" class="t">DiskScope</text>
<text x="984" y="44" class="e" text-anchor="end">ARCHIL AWS-US-EAST-1 · 510 OBSERVATIONS</text>
<line x1="32" x2="984" y1="66" y2="66" stroke="var(--ink)" stroke-width="1"/><text x="32" y="94" class="k">Serverless call</text><text x="32" y="138" class="v">157 ms</text><text x="32" y="160" class="d">no-op, default image · was 349 ms</text><line x1="270" x2="270" y1="66" y2="168" stroke="var(--grid)"/><text x="290" y="94" class="k">Warm sandbox worker</text><text x="290" y="138" class="v">76.8 ms</text><text x="290" y="160" class="d">no-op · one-time boot 1.91 s</text><line x1="508" x2="508" y1="66" y2="168" stroke="var(--grid)"/><text x="528" y="94" class="k">Queue · VM · mount</text><text x="528" y="138" class="v">33.0 ms</text><text x="528" y="160" class="d">warm pool · 143 ms custom image</text><line x1="746" x2="746" y1="66" y2="168" stroke="var(--grid)"/><text x="766" y="94" class="k">Durable fsync vs local</text><text x="766" y="138" class="v">1.4×</text><text x="766" y="160" class="d">guest-measured, 4 KiB</text></svg>
